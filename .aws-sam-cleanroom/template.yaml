AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable Google Calendar and Todoist synchronization owned by todoist-calendar-sync.
Parameters:
  Stage:
    Type: String
    Default: production
    AllowedValues:
    - production
  ResourceNamePrefix:
    Type: String
    Default: todoist-calendar-sync
    AllowedPattern: ^[a-z0-9-]+$
    Description: Physical AWS resource prefix. Set explicitly to the legacy prefix
      only during the controlled cutover.
  CalendarWatchTokenParameter:
    Type: String
    Default: /todoist-calendar-sync/calendar-watch-token
  TodoistWebhookSecretParameter:
    Type: String
    Default: /todoist-calendar-sync/todoist-webhook-secret
  ProxySharedSecretParameter:
    Type: String
    Default: /todoist-calendar-sync/proxy-shared-secret
  GoogleCredentialsParameterPrefix:
    Type: String
    Default: /todoist-calendar-sync/google
  TodoistTokenParameterPrefix:
    Type: String
    Default: /todoist-calendar-sync/todoist
  SlackBotTokenParameter:
    Type: String
    Default: /lambdas/shared/slack-bot-token
  TodoistCalendarSyncSlackChannel:
    Type: String
    MinLength: 2
  ProfileConfigJson:
    Type: String
    NoEcho: true
    MinLength: 2
    Description: JSON profile routing configuration supplied from protected deployment
      configuration.
  ManualInterventionEnabled:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
  StateTableReadCapacity:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Fixed DynamoDB read capacity. This stack does not configure Application
      Auto Scaling.
  StateTableWriteCapacity:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Fixed DynamoDB write capacity. This stack does not configure Application
      Auto Scaling.
  DynamoDbScanRcuBudgetPerSecond:
    Type: Number
    Default: 10
    MinValue: 1
    Description: Background RCU budget used to pace full-table scan pages inside one
      worker invocation.
  DynamoDbScanPageItemLimit:
    Type: Number
    Default: 25
    MinValue: 1
    Description: Maximum evaluated items requested per DynamoDB scan page.
  ReconciliationCandidateLimit:
    Type: Number
    Default: 20
    MinValue: 1
    Description: Maximum mapped/unmapped Todoist candidates processed by one reconciliation
      chunk.
  BillingAlarmEmail:
    Type: String
    Default: ''
  MonthlyBillingLimitUsd:
    Type: Number
    Default: 5
Conditions:
  HasBillingAlarmEmail:
    Fn::Not:
    - Fn::Equals:
      - Ref: BillingAlarmEmail
      - ''
Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 25
    Tracing: Active
    Architectures:
    - arm64
    Environment:
      Variables:
        STATE_TABLE_NAME:
          Ref: SyncState
        QUEUE_URL:
          Ref: SyncQueue
        SYNC_PROFILE_CONFIG_JSON:
          Ref: ProfileConfigJson
        CALENDAR_WATCH_TOKEN_PARAMETER:
          Ref: CalendarWatchTokenParameter
        TODOIST_WEBHOOK_SECRET_PARAMETER:
          Ref: TodoistWebhookSecretParameter
        PROXY_SHARED_SECRET_PARAMETER:
          Ref: ProxySharedSecretParameter
        GOOGLE_CREDENTIALS_PARAMETER_PREFIX:
          Ref: GoogleCredentialsParameterPrefix
        TODOIST_TOKEN_PARAMETER_PREFIX:
          Ref: TodoistTokenParameterPrefix
        TODOIST_CALENDAR_SYNC_DYNAMODB_SCAN_RCU_BUDGET_PER_SECOND:
          Ref: DynamoDbScanRcuBudgetPerSecond
        TODOIST_CALENDAR_SYNC_DYNAMODB_SCAN_PAGE_ITEM_LIMIT:
          Ref: DynamoDbScanPageItemLimit
        TODOIST_CALENDAR_SYNC_RECONCILIATION_CANDIDATE_LIMIT:
          Ref: ReconciliationCandidateLimit
Resources:
  SyncState:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${ResourceNamePrefix}-state-${Stage}
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits:
          Ref: StateTableReadCapacity
        WriteCapacityUnits:
          Ref: StateTableWriteCapacity
      DeletionProtectionEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  SyncDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: ${ResourceNamePrefix}-dlq-${Stage}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 604800
      SqsManagedSseEnabled: true
  SyncQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName:
        Fn::Sub: ${ResourceNamePrefix}-${Stage}.fifo
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 900
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - SyncDlq
          - Arn
        maxReceiveCount: 1
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName:
        Fn::Sub: ${ResourceNamePrefix}-alerts-${Stage}
  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasBillingAlarmEmail
    Properties:
      TopicArn:
        Ref: AlertTopic
      Protocol: email
      Endpoint:
        Ref: BillingAlarmEmail
  IngressLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ResourceNamePrefix}-ingress-${Stage}
      RetentionInDays: 14
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ResourceNamePrefix}-worker-${Stage}
      RetentionInDays: 14
  ReconcilerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${ResourceNamePrefix}-reconciler-${Stage}
      RetentionInDays: 14
  IngressFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-ingress-${Stage}
      Handler: handler.handler
      ReservedConcurrentExecutions: 2
      CodeUri: IngressFunction
      Policies:
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - SyncQueue
            - QueueName
      - Statement:
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CalendarWatchTokenParameter}
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TodoistWebhookSecretParameter}
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ProxySharedSecretParameter}
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      AutoPublishAlias: live
      DeploymentPreference:
        Type: AllAtOnce
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/handler.ts
        Format: cjs
        Minify: true
        Target: es2022
      SamResourceId: IngressFunction
  IngressUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: IngressFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE
  IngressInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: IngressFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  WorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-worker-${Stage}
      Handler: worker.handler
      ReservedConcurrentExecutions: 1
      Timeout: 300
      CodeUri: WorkerFunction
      Environment:
        Variables:
          TODOIST_CALENDAR_SYNC_MANUAL_INTERVENTION_ENABLED:
            Ref: ManualInterventionEnabled
          TODOIST_CALENDAR_SYNC_SLACK_CHANNEL:
            Ref: TodoistCalendarSyncSlackChannel
          SLACK_BOT_TOKEN_PARAMETER:
            Ref: SlackBotTokenParameter
      Policies:
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - SyncQueue
            - QueueName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SyncState
      - Statement:
        - Effect: Allow
          Action: dynamodb:TransactWriteItems
          Resource:
            Fn::GetAtt:
            - SyncState
            - Arn
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleCredentialsParameterPrefix}/*
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TodoistTokenParameterPrefix}/*
          - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SlackBotTokenParameter}
      Events:
        SyncQueue:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - SyncQueue
              - Arn
            BatchSize: 1
            Enabled: true
            FunctionResponseTypes:
            - ReportBatchItemFailures
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/worker.ts
        Format: cjs
        Minify: true
        Target: es2022
      SamResourceId: WorkerFunction
  ReconcilerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${ResourceNamePrefix}-reconciler-${Stage}
      Handler: reconcile.handler
      ReservedConcurrentExecutions: 1
      CodeUri: ReconcilerFunction
      Policies:
      - SQSSendMessagePolicy:
          QueueName:
            Fn::GetAtt:
            - SyncQueue
            - QueueName
      - DynamoDBCrudPolicy:
          TableName:
            Ref: SyncState
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
        - src/reconcile.ts
        Format: cjs
        Minify: true
        Target: es2022
      SamResourceId: ReconcilerFunction
  ReconcilerFunctionEveryFifteenMinutes:
    Type: AWS::Events::Rule
    Properties:
      Name:
        Fn::Sub: ${ResourceNamePrefix}-reconcile-${Stage}
      ScheduleExpression: rate(1 hour)
      State: ENABLED
      Targets:
      - Arn:
          Fn::GetAtt:
          - ReconcilerFunction
          - Arn
        Id: ReconcilerFunctionEveryFifteenMinutesLambdaTarget
  ReconcilerFunctionEveryFifteenMinutesPermission:
    Type: AWS::Lambda::Permission
    DependsOn: ReconcilerFunctionEveryFifteenMinutes
    Properties:
      Action: lambda:InvokeFunction
      FunctionName:
        Ref: ReconcilerFunction
      Principal: events.amazonaws.com
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${ResourceNamePrefix}-reconcile-${Stage}
  DlqAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${ResourceNamePrefix}-dlq-not-empty-${Stage}
      AlarmDescription: A todoist-calendar-sync delivery was quarantined; inspect
        worker delivery_failed_for_dlq log using the delivery/message id.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - SyncDlq
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  SourceQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${ResourceNamePrefix}-source-oldest-message-${Stage}
      AlarmDescription: The source FIFO queue has a message older than five minutes.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - SyncQueue
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  SourceQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${ResourceNamePrefix}-source-depth-${Stage}
      AlarmDescription: More than 100 queued deliveries indicates sustained backpressure
        rather than a short absorbed burst.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
      - Name: QueueName
        Value:
          Fn::GetAtt:
          - SyncQueue
          - QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  WorkerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${ResourceNamePrefix}-worker-errors-${Stage}
      AlarmDescription: Worker Lambda has reported an invocation error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
      - Name: FunctionName
        Value:
          Ref: WorkerFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  DynamoDbReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${ResourceNamePrefix}-dynamodb-read-throttles-${Stage}
      AlarmDescription: Fixed provisioned read capacity has throttled a todoist-calendar-sync
        state-table request.
      Namespace: AWS/DynamoDB
      MetricName: ReadThrottleEvents
      Dimensions:
      - Name: TableName
        Value:
          Ref: SyncState
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  DynamoDbWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${ResourceNamePrefix}-dynamodb-write-throttles-${Stage}
      AlarmDescription: Fixed provisioned write capacity has throttled a todoist-calendar-sync
        state-table request.
      Namespace: AWS/DynamoDB
      MetricName: WriteThrottleEvents
      Dimensions:
      - Name: TableName
        Value:
          Ref: SyncState
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  DynamoDbReadUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${ResourceNamePrefix}-dynamodb-read-utilization-${Stage}
      AlarmDescription: Fixed provisioned read capacity has remained above 80 percent
        for two minutes; investigate backlog or raise the explicit capacity setting
        if this is steady-state demand.
      Metrics:
      - Id: consumed
        MetricStat:
          Metric:
            Namespace: AWS/DynamoDB
            MetricName: ConsumedReadCapacityUnits
            Dimensions:
            - Name: TableName
              Value:
                Ref: SyncState
          Period: 60
          Stat: Sum
        ReturnData: false
      - Id: provisioned
        MetricStat:
          Metric:
            Namespace: AWS/DynamoDB
            MetricName: ProvisionedReadCapacityUnits
            Dimensions:
            - Name: TableName
              Value:
                Ref: SyncState
          Period: 60
          Stat: Average
        ReturnData: false
      - Id: utilization
        Expression: 100 * consumed / (provisioned * 60)
        Label: DynamoDB read capacity utilization
        ReturnData: true
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  DynamoDbWriteUtilizationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: ${ResourceNamePrefix}-dynamodb-write-utilization-${Stage}
      AlarmDescription: Fixed provisioned write capacity has remained above 80 percent
        for two minutes; investigate backlog or raise the explicit capacity setting
        if this is steady-state demand.
      Metrics:
      - Id: consumed
        MetricStat:
          Metric:
            Namespace: AWS/DynamoDB
            MetricName: ConsumedWriteCapacityUnits
            Dimensions:
            - Name: TableName
              Value:
                Ref: SyncState
          Period: 60
          Stat: Sum
        ReturnData: false
      - Id: provisioned
        MetricStat:
          Metric:
            Namespace: AWS/DynamoDB
            MetricName: ProvisionedWriteCapacityUnits
            Dimensions:
            - Name: TableName
              Value:
                Ref: SyncState
          Period: 60
          Stat: Average
        ReturnData: false
      - Id: utilization
        Expression: 100 * consumed / (provisioned * 60)
        Label: DynamoDB write capacity utilization
        ReturnData: true
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
      - Ref: AlertTopic
  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBillingAlarmEmail
    Properties:
      Budget:
        BudgetName:
          Fn::Sub: ${ResourceNamePrefix}-monthly-cost-${Stage}
        BudgetLimit:
          Amount:
            Ref: MonthlyBillingLimitUsd
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
      - Notification:
          NotificationType: ACTUAL
          ComparisonOperator: GREATER_THAN
          Threshold: 80
          ThresholdType: PERCENTAGE
        Subscribers:
        - SubscriptionType: EMAIL
          Address:
            Ref: BillingAlarmEmail
Outputs:
  IngressFunctionUrl:
    Value:
      Fn::GetAtt:
      - IngressFunctionUrl
      - FunctionUrl
  StateTableName:
    Value:
      Ref: SyncState
  StateTableReadCapacity:
    Value:
      Ref: StateTableReadCapacity
  StateTableWriteCapacity:
    Value:
      Ref: StateTableWriteCapacity
  QueueUrl:
    Value:
      Ref: SyncQueue
  QueueArn:
    Value:
      Fn::GetAtt:
      - SyncQueue
      - Arn
  DlqUrl:
    Value:
      Ref: SyncDlq
  AlertTopicArn:
    Value:
      Ref: AlertTopic
