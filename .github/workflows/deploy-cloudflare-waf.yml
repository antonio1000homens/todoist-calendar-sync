name: Deploy Calendar WAF

on:
  push:
    branches: [master]
    paths:
      - infrastructure/cloudflare-waf/**
      - .github/workflows/deploy-cloudflare-waf.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: todoist-calendar-sync-cloudflare-waf-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      CODE_BUCKET: ${{ vars.CODE_BUCKET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.TODOIST_CALENDAR_SYNC_CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: infrastructure/cloudflare-waf

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - uses: aws-actions/configure-aws-credentials@v6.0.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-todoist-calendar-sync-cloudflare-waf
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_TO_ASSUME CODE_BUCKET CLOUDFLARE_API_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production environment variable: $name" >&2
              exit 1
            fi
          done

      - name: Terraform init
        run: >-
          terraform init -input=false
          -backend-config="bucket=${CODE_BUCKET}"
          -backend-config="key=todoist-calendar-sync/cloudflare-waf/terraform.tfstate"
          -backend-config="region=${AWS_REGION}"
          -backend-config="use_lockfile=true"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -no-color -var="cloudflare_api_token=${CLOUDFLARE_API_TOKEN}"

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve -no-color -var="cloudflare_api_token=${CLOUDFLARE_API_TOKEN}"

      - name: Publish ruleset ID
        run: |
          ruleset_id="$(terraform output -raw calendar_sync_custom_ruleset_id)"
          echo "Calendar custom ruleset ID: ${ruleset_id}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Set this value as CALENDAR_SYNC_CUSTOM_RULESET_ID in windsor-app before removing inline exceptions."
