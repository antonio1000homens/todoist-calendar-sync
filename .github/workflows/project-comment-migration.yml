name: Project comment mapping migration

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/project-comment-migration.yml
      - infrastructure/github-actions-migration-access.yaml
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Deploy production]
    types: [completed]
  workflow_dispatch:
    inputs:
      profile:
        description: Profile to inspect or migrate (all is report-only)
        type: choice
        required: true
        default: all
        options:
          - all
          - home
          - antonio
          - work
      operation:
        description: Migration phase (report by default)
        type: choice
        required: true
        default: report
        options:
          - report
          - backfill-apply
          - cleanup-report
          - cleanup-apply
          - tombstones-report
          - tombstones-apply
      confirmation:
        description: For writes, type the exact operation-specific confirmation
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: todoist-calendar-sync-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    # Manual migration commands are owner-issued. Successful production deploys
    # automatically start the all-profile migration.
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 61 &&
       github.event.comment.user.login == github.repository_owner &&
       startsWith(github.event.comment.body, '/mapping-migrate ')) ||
      (github.event_name != 'workflow_run' && github.event_name != 'issue_comment')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      STACK_NAME: ${{ vars.STACK_NAME }}
      SSM_PREFIX: ${{ vars.SSM_PREFIX }}
      SYNC_PROFILE_CONFIG_JSON: ${{ vars.SYNC_PROFILE_CONFIG_JSON }}
      MIGRATION_PROFILE: ${{ inputs.profile || 'all' }}
      MIGRATION_OPERATION: ${{ inputs.operation || (github.event_name == 'workflow_run' && 'automatic-post-deployment' || 'report') }}
      MIGRATION_CONFIRMATION: ${{ inputs.confirmation }}
      MIGRATION_REQUEST: ${{ github.event.comment.body || '' }}
    steps:
      - name: Resolve owner-issued migration command
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MIGRATION_REQUEST" == '/mapping-migrate all report' ]]; then
            profile=all
            operation=report
          elif [[ "$MIGRATION_REQUEST" =~ ^/mapping-migrate[[:space:]]+(home|antonio|work)[[:space:]]+(report|backfill|cleanup-report|cleanup-apply|tombstones-report|tombstones-apply)$ ]]; then
            profile="${BASH_REMATCH[1]}"
            operation="${BASH_REMATCH[2]}"
          else
            echo 'Unrecognized production migration command' >&2
            exit 2
          fi
          confirmation=''
          if [[ "$operation" == backfill ]]; then
            operation=backfill-apply
            confirmation=BACKFILL
          elif [[ "$operation" == cleanup-apply ]]; then
            confirmation=DELETE_VERIFIED_LEGACY_COMMENTS
          elif [[ "$operation" == tombstones-apply ]]; then
            confirmation=DELETE_EXPIRED_ERASURE_TOMBSTONES
          fi
          {
            printf 'MIGRATION_PROFILE=%s\n' "$profile"
            printf 'MIGRATION_OPERATION=%s\n' "$operation"
            printf 'MIGRATION_CONFIRMATION=%s\n' "$confirmation"
          } >> "$GITHUB_ENV"

      - name: Validate migration guardrails
        shell: bash
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          GITHUB_EVENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_TO_ASSUME STACK_NAME SSM_PREFIX SYNC_PROFILE_CONFIG_JSON; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production environment variable: $name" >&2
              exit 1
            fi
          done
          case "$MIGRATION_OPERATION" in
            report|cleanup-report) ;;
            automatic-post-deployment)
              [[ "$GITHUB_EVENT_NAME" == workflow_run && "$MIGRATION_PROFILE" == all && \
                 "$GITHUB_EVENT_CONCLUSION" == success && "$GITHUB_EVENT_BRANCH" == master ]] || {
                echo 'Automatic migration requires a successful production deployment from master' >&2
                exit 1
              } ;;
            tombstones-report)
              [[ "$MIGRATION_PROFILE" != all ]] || {
                echo 'Expired tombstone report requires one profile' >&2
                exit 1
              } ;;
            backfill-apply)
              [[ "$MIGRATION_PROFILE" != all && "$MIGRATION_CONFIRMATION" == BACKFILL ]] || {
                echo 'Backfill writes require one profile and confirmation BACKFILL' >&2
                exit 1
              } ;;
            cleanup-apply)
              [[ "$MIGRATION_PROFILE" != all && "$MIGRATION_CONFIRMATION" == DELETE_VERIFIED_LEGACY_COMMENTS ]] || {
                echo 'Legacy deletion requires one profile and exact confirmation DELETE_VERIFIED_LEGACY_COMMENTS' >&2
                exit 1
              } ;;
            tombstones-apply)
              [[ "$MIGRATION_PROFILE" != all && "$MIGRATION_CONFIRMATION" == DELETE_EXPIRED_ERASURE_TOMBSTONES ]] || {
                echo 'Expired tombstone deletion requires one profile and exact confirmation DELETE_EXPIRED_ERASURE_TOMBSTONES' >&2
                exit 1
              } ;;
            *) exit 2 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test migration revision
        run: npm test

      - name: Authenticate to production AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-project-comment-migration
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve production DynamoDB and credential prefixes
        shell: bash
        run: |
          set -euo pipefail
          state_table="$(aws cloudformation describe-stack-resource \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --logical-resource-id SyncState \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          erasure_queue="$(aws cloudformation describe-stack-resource \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --logical-resource-id ErasureOperationQueue \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          erasure_dlq="$(aws cloudformation describe-stack-resource \
            --region "$AWS_REGION" \
            --stack-name "$STACK_NAME" \
            --logical-resource-id ErasureOperationDlq \
            --query 'StackResourceDetail.PhysicalResourceId' \
            --output text)"
          if [[ "$erasure_queue" != https://* ]]; then
            erasure_queue="$(aws sqs get-queue-url --region "$AWS_REGION" --queue-name "$erasure_queue" --query QueueUrl --output text)"
          fi
          if [[ "$erasure_dlq" != https://* ]]; then
            erasure_dlq="$(aws sqs get-queue-url --region "$AWS_REGION" --queue-name "$erasure_dlq" --query QueueUrl --output text)"
          fi
          {
            echo "STATE_TABLE_NAME=$state_table"
            echo "ERASURE_OPERATION_QUEUE_URL=$erasure_queue"
            echo "ERASURE_OPERATION_DLQ_URL=$erasure_dlq"
            echo "GOOGLE_CREDENTIALS_PARAMETER_PREFIX=${SSM_PREFIX%/}/google"
            echo "TODOIST_TOKEN_PARAMETER_PREFIX=${SSM_PREFIX%/}/todoist"
          } >> "$GITHUB_ENV"

      - name: Report, backfill, or clean up verified mapping comments
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MIGRATION_OPERATION" == tombstones-report || "$MIGRATION_OPERATION" == tombstones-apply ]]; then
            args=("--profile=$MIGRATION_PROFILE")
            if [[ "$MIGRATION_OPERATION" == tombstones-apply ]]; then
              args+=(--apply --confirm=DELETE_EXPIRED_ERASURE_TOMBSTONES)
            fi
            npm run cleanup:erasure-tombstones -- "${args[@]}" | tee project-comment-migration-results.json
            exit 0
          fi
          if [[ "$MIGRATION_OPERATION" == automatic-post-deployment ]]; then
            node scripts/automatic-project-comment-migration.mjs | tee project-comment-migration-results.json
            exit 0
          fi
          args=("$MIGRATION_PROFILE")
          case "$MIGRATION_OPERATION" in
            report) ;;
            backfill-apply) args+=(--apply) ;;
            cleanup-report) args+=(--cleanup-legacy) ;;
            cleanup-apply) args+=(--cleanup-legacy --apply) ;;
          esac
          npm run migrate:project-comments -- "${args[@]}" | tee project-comment-migration-results.json

      - name: Wait for legacy erasure operations and fences to drain
        if: success() && github.event_name == 'workflow_run' && env.MIGRATION_OPERATION == 'automatic-post-deployment'
        env:
          LEGACY_CUTOVER_RESULT_FILE: legacy-cutover-audit-result.json
          LEGACY_CUTOVER_TIMEOUT_MS: '1500000'
        run: node scripts/legacy-erasure-cutover-audit.mjs

      - name: Summarise migration results
        if: always()
        shell: bash
        run: |
          echo '## Project comment migration' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Profile: **$MIGRATION_PROFILE**; operation: **$MIGRATION_OPERATION**" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f project-comment-migration-results.json ]]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const text = fs.readFileSync('project-comment-migration-results.json', 'utf8');
          // npm and DynamoDB progress logs precede the final pretty-printed
          // migration JSON. Parse the *last* top-level summary, not an earlier
          // single-line telemetry object with a "mode" field.
          const marker = '{\n  "mode":';
          const start = text.lastIndexOf(marker);
          if (start < 0) {
            console.log('The runner did not produce a parsable summary; inspect workflow logs.');
            process.exit(0);
          }
          const result = JSON.parse(text.slice(start).trim());
          const columns = ['mappingsScanned','projectCommentsMissing','projectCommentsCreated','legacyTaskCommentsFound','legacyTaskCommentsCleanupEligible','legacyTaskCommentsDeleted','legacyTaskCommentsAlreadyMissing','legacyTaskCommentsCleanupRejected','legacyCorrelationRowsRetired','legacyCorrelationRetirementRejected','duplicateProjectComments','missingTasks','missingCalendarEvents','failures'];
          console.log('| Phase | Profile | ' + columns.join(' | ') + ' |');
          console.log('| --- | --- | ' + columns.map(() => '---:').join(' | ') + ' |');
          const phases = result.phases || { results: result.results || {} };
          for (const [phase, profiles] of Object.entries(phases)) {
            for (const [profile, info] of Object.entries(profiles || {})) {
              console.log('| ' + phase + ' | ' + profile + ' | ' + columns.map(k => info[k] ?? 0).join(' | ') + ' |');
            }
          }
          NODE
          fi

      - name: Upload sanitized migration result
        if: always() && (hashFiles('project-comment-migration-results.json') != '' || hashFiles('legacy-cutover-audit-result.json') != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: project-comment-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            project-comment-migration-results.json
            legacy-cutover-audit-result.json
          retention-days: 14

      - name: Dispatch production acceptance after automatic migration
        if: success() && github.event_name == 'workflow_run' && env.MIGRATION_OPERATION == 'automatic-post-deployment'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=automatic-project-comment-migration
