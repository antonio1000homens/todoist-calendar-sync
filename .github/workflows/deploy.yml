name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: todoist-calendar-sync-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
      CODE_BUCKET: ${{ vars.CODE_BUCKET }}
      STACK_NAME: ${{ vars.STACK_NAME }}
      RESOURCE_NAME_PREFIX: ${{ vars.RESOURCE_NAME_PREFIX }}
      SSM_PREFIX: ${{ vars.SSM_PREFIX }}
      TODOIST_CALENDAR_SYNC_SLACK_CHANNEL: ${{ vars.TODOIST_CALENDAR_SYNC_SLACK_CHANNEL }}
      TODOIST_SLACK_ALLOWED_USER_IDS: ${{ vars.TODOIST_SLACK_ALLOWED_USER_IDS }}
      TODOIST_CALENDAR_SYNC_BILLING_ALARM_EMAIL: ${{ vars.TODOIST_CALENDAR_SYNC_BILLING_ALARM_EMAIL }}
      SYNC_PROFILE_CONFIG_JSON: ${{ vars.SYNC_PROFILE_CONFIG_JSON }}
      ERASURE_CALENDAR_PROVENANCE_PUBLIC_KEY_SPKI_B64: ${{ vars.ERASURE_CALENDAR_PROVENANCE_PUBLIC_KEY_SPKI_B64 }}
      CF_ACCESS_ISSUER: ${{ vars.CF_ACCESS_ISSUER }}
      CF_ACCESS_AUDIENCE: ${{ vars.CF_ACCESS_AUDIENCE }}
      REVIEW_OPERATOR_EMAILS: ${{ vars.REVIEW_OPERATOR_EMAILS }}
      # Keep item erasure execution disabled until #347 writer-boundary and #349
      # disposable acceptance/release gates are complete. This reuses the
      # existing two-Lambda gate; it does not add another feature flag.
      ERASURE_EXECUTION_ENABLED: 'false'
      # Set this production environment variable to true ONLY after #277
      # (seven-day retained mappings) has been deployed and verified.
      # Unset/false keeps the destructive cleanup OFF; revert without code edits.
      COMPLETED_HISTORY_CLEANUP_APPLY: ${{ vars.COMPLETED_HISTORY_CLEANUP_APPLY || 'false' }}
      # #290: true by operator request; set production var PHASE_C_NATIVE_ENABLED=false
      # and dispatch deployment to roll back new native Calendar->Todoist creation.
      PHASE_C_NATIVE_ENABLED: ${{ vars.PHASE_C_NATIVE_ENABLED || 'true' }}
      # A merge triggers automatic production deployment; lowering live RCU/WCU
      # requires a separate operator approval in the production environment.
      DYNAMODB_CAPACITY_REDUCTION_APPROVED: ${{ vars.DYNAMODB_CAPACITY_REDUCTION_APPROVED }}
      # Unset by default; explicit acknowledgement required for temporary
      # above-Free-Tier rollback during an incident.
      DYNAMODB_ALLOW_PAID_CAPACITY: ${{ vars.DYNAMODB_ALLOW_PAID_CAPACITY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.TODOIST_CALENDAR_SYNC_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate non-secret deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in AWS_REGION AWS_ROLE_TO_ASSUME CODE_BUCKET STACK_NAME RESOURCE_NAME_PREFIX SSM_PREFIX TODOIST_CALENDAR_SYNC_SLACK_CHANNEL SYNC_PROFILE_CONFIG_JSON CF_ACCESS_ISSUER CF_ACCESS_AUDIENCE REVIEW_OPERATOR_EMAILS CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing production environment variable: $name" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          use-installer: true
          token: ${{ github.token }}

      - name: Install dependencies
        run: npm ci

      - name: Build and test exact deployment revision
        run: npm test

      - name: Check public-source boundary
        run: bash scripts/check-public-source.sh

      - name: Validate SAM template
        run: sam validate --lint --template template.yaml

      - name: Build SAM application
        run: PATH="$PWD/node_modules/.bin:$PATH" sam build --template template.yaml

      - name: Build review page
        run: npm run build:review

      - name: Test Calendar Cloudflare Worker
        run: node --test cloudflare/calendar-sync/worker.test.mjs

      - name: Validate Cloudflare Worker deployment
        run: npx wrangler deploy --config cloudflare/calendar-sync/wrangler.toml --dry-run

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-todoist-calendar-sync
          aws-region: ${{ env.AWS_REGION }}

      - name: Gate cleanup activation on retained-mapping implementation (#277)
        shell: bash
        run: |
          set -euo pipefail
          case "$COMPLETED_HISTORY_CLEANUP_APPLY" in
            true|false) ;;
            *) echo "COMPLETED_HISTORY_CLEANUP_APPLY must be true or false" >&2; exit 1 ;;
          esac
          if [ "$COMPLETED_HISTORY_CLEANUP_APPLY" = "true" ]; then
            # This is a defense-in-depth check. Source code and regression tests
            # for #277 must be in the EXACT revision built for deployment.
            node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const cleanup = readFileSync("src/completed-history-cleanup.ts", "utf8");
          const sync = readFileSync("src/sync.ts", "utf8");
          const repository = readFileSync("src/repository.ts", "utf8");
          const tests = readFileSync("test/completed-history-cleanup.test.mjs", "utf8");
          if (!cleanup.includes("if (ownPresent)") ||
              !cleanup.includes("retainedKeys") ||
              !sync.includes("if (mapping.recurrenceOwner || mapping.seriesId)") ||
              !repository.includes("reopenRetainedStandaloneMapping(") ||
              !tests.includes("cleanup retires the exact unchanged standalone mapping triplet after seven days")) {
            throw new Error("Refusing automatic cleanup: #277 seven-day retained-mapping lifecycle is absent");
          }
          NODE
          fi

      - name: Deploy todoist-calendar-sync
        env:
          SKIP_SOURCE_VALIDATION: 'true'
          BILLING_ALARM_EMAIL: ${{ env.TODOIST_CALENDAR_SYNC_BILLING_ALARM_EMAIL }}
        run: bash ./deploy.sh

      - name: Verify completed-history retirement schedule and Lambda mode
        shell: bash
        run: |
          set -euo pipefail
          expected="${COMPLETED_HISTORY_CLEANUP_APPLY}"
          actual="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$STACK_NAME" --query "Stacks[0].Parameters[?ParameterKey=='CompletedHistoryCleanupApply'].ParameterValue | [0]" --output text)"
          if [ "$actual" != "$expected" ]; then
            echo "CompletedHistoryCleanupApply stack parameter mismatch." >&2
            exit 1
          fi
          function_name="$(aws cloudformation describe-stack-resource --region "$AWS_REGION" --stack-name "$STACK_NAME" --logical-resource-id CompletedHistoryCleanupFunction --query 'StackResourceDetail.PhysicalResourceId' --output text)"
          deployed_flag="$(aws lambda get-function-configuration --region "$AWS_REGION" --function-name "$function_name" --query 'Environment.Variables.TODOIST_CALENDAR_SYNC_COMPLETED_CLEANUP_APPLY' --output text)"
          rule_name="$(aws cloudformation describe-stack-resource --region "$AWS_REGION" --stack-name "$STACK_NAME" --logical-resource-id CompletedHistoryCleanupFunctionDailyCompletedHistoryReview --query 'StackResourceDetail.PhysicalResourceId' --output text)"
          rule_state="$(aws events describe-rule --region "$AWS_REGION" --name "$rule_name" --query State --output text)"
          expected_state="DISABLED"
          if [ "$expected" = "true" ]; then expected_state="ENABLED"; fi
          if [ "$deployed_flag" != "$expected" ] || [ "$rule_state" != "$expected_state" ]; then
            echo "Completed-history Lambda mode or EventBridge schedule does not match expected state." >&2
            exit 1
          fi
          echo "Completed-history cleanup mode and schedule verified."

      - name: Verify erasure execution flag and protocol on both deployed Lambdas
        shell: bash
        run: |
          set -euo pipefail
          expected="${ERASURE_EXECUTION_ENABLED}"
          actual="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$STACK_NAME" --query "Stacks[0].Parameters[?ParameterKey=='ErasureExecutionEnabled'].ParameterValue | [0]" --output text)"
          if [ "$actual" != "$expected" ]; then
            echo "ErasureExecutionEnabled stack parameter mismatch." >&2
            exit 1
          fi
          for logical_id in ReviewApiFunction ErasureWorkerFunction; do
            function_name="$(aws cloudformation describe-stack-resource --region "$AWS_REGION" --stack-name "$STACK_NAME" --logical-resource-id "$logical_id" --query 'StackResourceDetail.PhysicalResourceId' --output text)"
            qualifier=()
            if [ "$logical_id" = "ReviewApiFunction" ]; then qualifier=(--qualifier live); fi
            deployed_flag="$(aws lambda get-function-configuration --region "$AWS_REGION" --function-name "$function_name" "${qualifier[@]}" --query 'Environment.Variables.ERASURE_EXECUTION_ENABLED' --output text)"
            deployed_protocol="$(aws lambda get-function-configuration --region "$AWS_REGION" --function-name "$function_name" "${qualifier[@]}" --query 'Environment.Variables.ERASURE_PROTOCOL_VERSION' --output text)"
            if [ "$deployed_flag" != "$expected" ] || [ "$deployed_protocol" != "1" ]; then
              echo "$logical_id: deployed erasure flag/protocol differs from approved configuration." >&2
              exit 1
            fi
            echo "$logical_id: erasure execution configuration verified."
          done

      - name: Provision Calendar Worker proxy secret from AWS SSM
        run: >-
          aws ssm get-parameter
          --region "$AWS_REGION"
          --name "/todoist-calendar-sync/proxy-shared-secret"
          --with-decryption
          --query 'Parameter.Value'
          --output text
          | npx wrangler secret put TODOIST_CALENDAR_SYNC_PROXY_SHARED_SECRET
          --config cloudflare/calendar-sync/wrangler.toml

      - name: Deploy Calendar Cloudflare Worker
        shell: bash
        run: |
          set -euo pipefail
          review_api_url="$(aws cloudformation describe-stacks --region "$AWS_REGION" --stack-name "$STACK_NAME" --query "Stacks[0].Outputs[?OutputKey=='ReviewApiFunctionUrl'].OutputValue | [0]" --output text)"
          if [ -z "$review_api_url" ] || [ "$review_api_url" = "None" ]; then
            echo "ReviewApiFunctionUrl output is missing from the deployed stack." >&2
            exit 1
          fi
          npx wrangler deploy --config cloudflare/calendar-sync/wrangler.toml --var "TODOIST_CALENDAR_SYNC_REVIEW_API_URL:$review_api_url"
