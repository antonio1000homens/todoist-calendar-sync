name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Check public-source boundary
        run: bash scripts/check-public-source.sh

      - uses: aws-actions/setup-sam@v3

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM application
        run: PATH="$PWD/node_modules/.bin:$PATH" sam build
