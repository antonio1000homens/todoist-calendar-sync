name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# Keep checks for the newest revision of each PR/ref. Older queued or running
# checks are superseded as soon as another commit arrives.
concurrency:
  group: todoist-calendar-sync-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production E2E harness syntax
        run: node --check scripts/production-e2e.mjs

      - name: Build and test
        run: npm test

      - name: Build review UI
        run: npm run build:review

      - name: Check public-source boundary
        run: bash scripts/check-public-source.sh

      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM application
        run: PATH="$PWD/node_modules/.bin:$PATH" sam build
